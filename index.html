<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora Creative League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12051f; --bg2:#1d0a33; --ink:#fff4e6; --ink-dim:#c9b3d6;
  --pink:#ff2d95; --orange:#ff7a1a; --teal:#2ee6d6; --violet:#7b2cff; --gold:#ffd166;
  --display:"Bebas Neue","Impact","Arial Narrow",sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100%;
  background-image:radial-gradient(120% 70% at 50% -10%, #3a0f5e 0%, transparent 60%),
                   linear-gradient(180deg,#12051f 0%,#0b0314 100%);}
body::after{content:"";pointer-events:none;position:fixed;inset:0;opacity:.14;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.6'/></svg>");}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px;position:relative;z-index:1}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:var(--display);font-size:clamp(44px,8vw,84px);line-height:.9;margin:0;letter-spacing:.01em;
  background:linear-gradient(100deg,var(--pink) 0%,var(--orange) 55%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
h1 small{display:block;font-family:var(--body);font-weight:700;font-size:14px;letter-spacing:.08em;color:var(--teal);-webkit-text-fill-color:var(--teal);margin-bottom:8px}
.season{font-family:var(--display);font-size:22px;line-height:1;text-align:right;color:var(--ink-dim)}
.season b{display:block;font-size:34px;color:var(--ink);font-weight:400}

.tabs{display:flex;gap:6px;margin:0 0 26px;border-bottom:2px solid #3a1a5a}
.tab{appearance:none;background:none;border:0;color:var(--ink-dim);font-family:var(--display);font-size:26px;letter-spacing:.03em;
  padding:8px 18px 10px;cursor:pointer;position:relative;transform:skewX(-10deg)}
.tab span{display:inline-block;transform:skewX(10deg)}
.tab[aria-selected="true"]{color:#12051f;background:linear-gradient(90deg,var(--teal),#9cf7ee)}
.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* hero #1 */
.champ{position:relative;display:grid;grid-template-columns:minmax(150px,220px) 1fr auto;gap:22px;align-items:center;
  padding:26px 28px;margin-bottom:18px;overflow:hidden;
  background:linear-gradient(110deg,#2a0b4a 0%,#4a1070 45%,#8b1d6e 80%,#ff5a2a 130%);
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);border-left:6px solid var(--gold)}
.champ::before{content:"";position:absolute;inset:-40% -10% auto auto;width:60%;height:160%;
  background:linear-gradient(100deg,transparent 0%,rgba(255,45,149,.35) 50%,transparent 100%);transform:rotate(12deg)}
.champ .photo{aspect-ratio:1;border-radius:0;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);
  background:#2b1142 center/cover no-repeat;border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(255,209,102,.18),0 20px 50px rgba(0,0,0,.5)}
.champ .who{position:relative;min-width:0}
.champ .name{font-family:var(--display);font-size:clamp(48px,9vw,112px);line-height:.85;margin:0;word-break:break-word}
.champ .tag{color:var(--gold);font-weight:800;font-size:15px;letter-spacing:.06em;margin:10px 0 0}
.champ .big{position:relative;text-align:right}
.champ .big .n{font-family:var(--display);font-size:clamp(64px,12vw,150px);line-height:.8;
  color:transparent;-webkit-text-stroke:3px var(--gold);text-stroke:3px var(--gold)}
.champ .big .lbl{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.06em;margin-top:6px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.stat{min-width:70px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--ink)}
.stat span{font-size:12px;color:var(--ink-dim);font-weight:700}

/* ranks 2+ */
.row{display:grid;grid-template-columns:72px 76px 1fr auto;gap:16px;align-items:center;padding:12px 18px 12px 0;
  margin:0 0 10px;background:linear-gradient(90deg,#24103f 0%,#1a0a2e 100%);
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);transition:transform .18s ease}
.row:nth-child(1){--acc:var(--pink)} .row:nth-child(2){--acc:var(--orange)} .row:nth-child(3){--acc:var(--teal)} .row:nth-child(n+4){--acc:var(--violet)}
.row .rk{font-family:var(--display);font-size:58px;line-height:.8;text-align:center;color:var(--acc);
  background:rgba(255,255,255,.04);align-self:stretch;display:grid;place-items:center;border-right:3px solid var(--acc)}
.row .photo{width:76px;height:76px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);background:#2b1142 center/cover no-repeat;border:2px solid var(--acc)}
.row .name{font-family:var(--display);font-size:clamp(30px,5vw,44px);line-height:.9;margin:0}
.row .sub{color:var(--ink-dim);font-size:13px;font-weight:700;margin-top:4px}
.row .score{text-align:right}
.row .score b{display:block;font-family:var(--display);font-size:48px;line-height:.85;color:var(--acc)}
.row .score span{font-size:12px;color:var(--ink-dim);font-weight:700}
.row .mini{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.row .mini i{font-style:normal;font-size:13px;color:var(--ink-dim)}
.row .mini i b{color:var(--ink);font-family:var(--body);font-weight:800}
.up{color:var(--teal)} .down{color:var(--pink)}
.row:hover{transform:translateX(6px)}
@media (prefers-reduced-motion: reduce){.row{transition:none}.row:hover{transform:none}}

/* hall of fame */
.hof{margin-top:34px;padding:18px 20px;border:2px solid var(--gold);background:rgba(255,209,102,.06);
  display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hof .trophy{font-family:var(--display);font-size:54px;line-height:.8;color:var(--gold)}
.hof h2{font-family:var(--display);font-size:30px;margin:0;line-height:.9}
.hof p{margin:6px 0 0;color:var(--ink-dim);font-size:15px}
.hof p b{color:var(--ink)}

footer{margin-top:28px;color:#7d6494;font-size:12px;font-weight:700;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.empty{padding:40px;text-align:center;color:var(--ink-dim);font-weight:700}

@media (max-width:640px){
  .champ{grid-template-columns:110px 1fr;padding:18px}
  .champ .big{grid-column:1 / -1;text-align:left;display:flex;align-items:baseline;gap:12px}
  .row{grid-template-columns:54px 56px 1fr;gap:10px}
  .row .rk{font-size:40px}
  .row .photo{width:56px;height:56px}
  .row .score{grid-column:1 / -1;text-align:left;display:flex;align-items:baseline;gap:10px;padding-left:64px}
  .row .score b{font-size:36px}
  .hof{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>Aurora Skin</small>Creative League</h1>
    <div class="season" id="season">Season resets Sunday<b id="clock">—</b></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-board="writers"><span>Copywriters</span></button>
    <button class="tab" role="tab" aria-selected="false" data-board="editors"><span>Editors</span></button>
  </div>

  <div id="board"></div>

  <div class="hof" id="hof"></div>

  <footer><span id="synced">Demo numbers until the first sync lands</span><span>Ranked by share of spend on winning ads this season</span></footer>
</div>

<script>
// Live data: the hourly sync writes data.json next to this file. If it isn’t there yet, the demo below shows.
const DEMO = {
  synced: null,
  season_ends: "Sunday 11pm ET",
  writers: [
    {name:"Adam", photo:"img/adam.jpg", share:0.58, winners:2, live:9, roas:1.31, hook:0.27, delta:"+12"},
    {name:"Lan", photo:"img/lan.jpg", share:0.24, winners:0, live:7, roas:1.06, hook:0.31, delta:"+4"},
    {name:"Dawid", photo:"img/dawid.jpg", share:0.18, winners:0, live:5, roas:0.98, hook:0.22, delta:"-3"},
    {name:"Alec", photo:"img/alec.jpg", share:0.00, winners:0, live:0, roas:0, hook:0, delta:"0"}
  ],
  editors: [
    {name:"Dawid", photo:"img/dawid.jpg", share:0.34, winners:1, live:11, roas:1.12, hook:0.25, delta:"+6"},
    {name:"Jeffrey", photo:"img/jeffrey.jpg", share:0.26, winners:1, live:9, roas:1.08, hook:0.29, delta:"+9"},
    {name:"Andrija", photo:"img/andrija.jpg", share:0.19, winners:0, live:8, roas:0.91, hook:0.24, delta:"-2"},
    {name:"Abdul", photo:"img/abdul.jpg", share:0.13, winners:0, live:6, roas:0.84, hook:0.21, delta:"+1"},
    {name:"Filip", photo:"img/filip.jpg", share:0.08, winners:0, live:4, roas:0.77, hook:0.19, delta:"0"}
  ],
  hall_of_fame: {ad:"AP_AD52", writer:"Adam", roas:1.56, spend_note:"first winner tagged by the system"}
};

const pct = v => Math.round((v||0)*100) + "%";
const x = v => (v||0).toFixed(2) + "x";
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(data, which){
  const list = (data[which]||[]).slice().sort((a,b)=>b.share-a.share);
  const el = document.getElementById("board");
  if(!list.length){ el.innerHTML = '<div class="empty">No one on the board yet this season. Ship something.</div>'; return; }
  const [top, ...rest] = list;
  const photo = p => p ? `style="background-image:url('${esc(p)}')"` : "";
  let html = `
  <section class="champ">
    <div class="photo" ${photo(top.photo)} role="img" aria-label="${esc(top.name)}"></div>
    <div class="who">
      <h2 class="name">${esc(top.name)}</h2>
      <p class="tag">Leading the ${which==="writers"?"copy":"edit"} board</p>
      <div class="stats">
        <div class="stat"><b>${pct(top.share)}</b><span>of winning spend</span></div>
        <div class="stat"><b>${top.winners}</b><span>winners</span></div>
        <div class="stat"><b>${top.live}</b><span>ads live</span></div>
        <div class="stat"><b>${x(top.roas)}</b><span>avg ROAS</span></div>
        <div class="stat"><b>${pct(top.hook)}</b><span>hook rate</span></div>
      </div>
    </div>
    <div class="big"><div class="n">1</div><div class="lbl">${esc(top.delta)} this week</div></div>
  </section>`;
  html += rest.map((p,i)=>`
  <div class="row">
    <div class="rk">${i+2}</div>
    <div class="photo" ${photo(p.photo)} role="img" aria-label="${esc(p.name)}"></div>
    <div>
      <h3 class="name">${esc(p.name)}</h3>
      <div class="mini"><i><b>${p.winners}</b> winners</i><i><b>${p.live}</b> live</i><i><b>${x(p.roas)}</b> avg</i><i><b>${pct(p.hook)}</b> hook</i></div>
    </div>
    <div class="score"><b>${pct(p.share)}</b><span class="${String(p.delta).startsWith('-')?'down':'up'}">${esc(p.delta)} this week</span></div>
  </div>`).join("");
  el.innerHTML = html;
}

function renderHof(h){
  const el = document.getElementById("hof");
  if(!h){ el.style.display="none"; return; }
  el.innerHTML = `<div class="trophy">MVP</div><div><h2>${esc(h.ad)} — ${esc(h.writer)}</h2><p><b>${x(h.roas)}</b> ROAS, best ad of the season${h.spend_note?" — "+esc(h.spend_note):""}</p></div>`;
}

function clock(){
  const now = new Date();
  const d = new Date(now); d.setDate(now.getDate() + ((7 - now.getDay()) % 7 || 7)); d.setHours(23,0,0,0);
  const ms = d - now, h = Math.floor(ms/36e5), m = Math.floor(ms%36e5/6e4);
  document.getElementById("clock").textContent = `${Math.floor(h/24)}d ${h%24}h ${m}m`;
}

let DATA = DEMO, WHICH = "writers";
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(o=>o.setAttribute("aria-selected","false"));
  t.setAttribute("aria-selected","true"); WHICH = t.dataset.board; render(DATA, WHICH);
}));

fetch("data.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
  if(j){ DATA = j; document.getElementById("synced").textContent = "Synced " + (j.synced||""); }
}).catch(()=>{}).finally(()=>{ render(DATA, WHICH); renderHof(DATA.hall_of_fame); clock(); setInterval(clock, 60000); });
</script>
</body>
</html>
